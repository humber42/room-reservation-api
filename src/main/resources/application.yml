spring:
  application:
    name: room-reservation-api
  datasource:
    url: jdbc:h2:file:./data/meetingrooms;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

app:
  auth:
    username: ${BOOKING_BASIC_USER:admin}
    password: ${BOOKING_BASIC_PASSWORD:dev-only-change-me}
